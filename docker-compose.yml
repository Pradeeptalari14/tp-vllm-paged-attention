version: '3.8'

services:
  vllm-paged-attention:
    image: vllm/vllm-openai:latest
    container_name: vllm-paged-server
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_BLOCK_SIZE=16
      - VLLM_GPU_MEMORY_UTILIZATION=0.92
      - VLLM_CHUNKED_PREFILL=1
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./models:/root/.cache/huggingface
    restart: unless-stopped
